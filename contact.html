<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Us</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover Lesotho tourism, culture, destinations and activities.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Contact Us</h1>
    <p>Plan your Lesotho adventure.</p>
</header>
<nav class="navbar navbar-expand-lg navbar-dark site-nav" aria-label="Main navigation">
    <div class="container">
        <a class="navbar-brand" href="index.html">Discover Lesotho</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
         aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon">

            </span>
        </button>
            
    <button type="dark">Dark Mode</button>
    <button type="light">Light Mode</button>
        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item">
                    <a class="nav-link" href="services.html">Services</a></li>
                <li class="nav-item">
                    <a class="nav-link" href="gallery.html">Gallery</a></li>
                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>
<main class="container">
    <section>
        <h2>Booking Enquiry</h2>
        <form id="bookingForm" novalidate>

            <label for="visitor" class="form-label">Full Name</label>
            <input class="form-control" type="text" id="visitor" name="visitor" required minlength="2" autocomplete="name">
            <label for="bookingEmail" class="form-label">Email Address</label>

            <input class="form-control" type="email" id="bookingEmail" name="bookingEmail" required autocomplete="email">
            <label for="bookingPhone" class="form-label">Phone Number</label>

            <input class="form-control" type="tel" id="bookingPhone" name="bookingPhone" required pattern="[0-9+() -]{7,20}" 
            placeholder="e.g. 58881234" autocomplete="tel">

            <label for="visitDate" class="form-label">Date of Visit</label>
            <input class="form-control" type="date" id="visitDate" name="visitDate" required>

            <label for="visitors" class="form-label">Number of Visitors</label>
            <input class="form-control" type="number" id="visitors" name="visitors" min="1" max="50" required>

            <button class="btn btn-success" type="submit">Send Booking Enquiry</button>
        </form>
        <div id="bookingMessage" class="mt-3" aria-live="polite">

        </div>
    </section>
    <section>
        <h2>Send Us a Message</h2>
        <form id="contactForm" novalidate>

            <label for="contactName" class="form-label">Your Name</label>

            <input class="form-control" type="text" id="contactName" name="contactName" required minlength="2" autocomplete="name">
            <label for="contactEmail" class="form-label">Your Email</label>

            <input class="form-control" type="email" id="contactEmail" name="contactEmail" required autocomplete="email">
            <label for="contactPhone" class="form-label">Phone Number (optional)</label>

            <input class="form-control" type="tel" id="contactPhone" name="contactPhone" pattern="[0-9+() -]{7,20}" autocomplete="tel">
            <label for="subject" class="form-label">Subject</label>

            <input class="form-control" type="text" id="subject" name="subject" required minlength="3">
            <label for="message" class="form-label">Your Message</label>

            <textarea class="form-control" id="message" name="message" required minlength="5">

            </textarea>
            <button class="btn btn-success" type="submit">Send Message</button>

        </form>
        <div id="contactMessage" class="mt-3" aria-live="polite">
            
        </div>
    </section>
</main>
<footer><p class="mb-0">Discover Lesotho Tourism &copy; 2026</p></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
